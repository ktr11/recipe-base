# Amplify Hosting のビルド仕様（docs/design.md §11）
#
# backend フェーズが amplify_outputs.json を生成し、frontend フェーズが
# それを取り込んでビルドする。この順序は Amplify が保証している。
#
# ⚠️ node_modules をキャッシュしないこと（§11.11）。pnpm の node_modules は
# シンボリックリンクの林で、アーカイブ時に実体を辿ると内容が何重にも
# 複製される。初回ビルドでは 4分29秒かけて作ったキャッシュが 5GB 超過で
# 捨てられた。pnpm install は26秒しかかからないため、キャッシュしない方が速い。

version: 1

backend:
  phases:
    build:
      commands:
        # ci.yml と同じ Node 22 に揃える。ビルド環境の既定に依存しない
        - nvm install 22
        - nvm use 22

        # パッケージマネージャーは package.json の packageManager で固定した
        # pnpm を使う（npm / yarn は使わない）。corepack がその指定を読む。
        # 非対話環境ではダウンロードの確認プロンプトで止まるため無効化する
        - export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        - corepack enable

        - pnpm install --frozen-lockfile

        # バックエンドをデプロイし、amplify_outputs.json を生成する。
        # $AWS_BRANCH と $AWS_APP_ID は Amplify がビルド環境に渡す。
        # アプリが分かれていれば同じブランチ名でもスタックは別になるため、
        # dev と prod のバックエンドが混ざることはない（§11.5）
        - pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        # backend フェーズで導入済み。フェーズをまたいでも同じ Node と
        # pnpm を使うよう選び直しておく（数秒で終わる保険）
        - nvm use 22
        - corepack enable
    build:
      commands:
        - pnpm build

  artifacts:
    # Next.js の SSR を Amplify Hosting compute に載せる場合の既定
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    # node_modules は入れない（冒頭の警告を参照）
    paths:
      - .next/cache/**/*
